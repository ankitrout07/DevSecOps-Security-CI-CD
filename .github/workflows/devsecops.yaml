name: DevSecOps Blue-Green CI/CD

on:
  push:
    branches: [main]

jobs:
  security-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Run Trivy Vulnerability Scanner (IaC)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'k8s'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'src/app/package-lock.json'

      - name: Install Dependencies
        run: |
          cd src/app
          npm ci

      - name: Run Tests
        run: |
          cd src/app
          npm test

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Build Docker Image
        run: docker build -t devsecops-node-app:${{ github.sha }} .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "devsecops-node-app:${{ github.sha }}"
          format: "table"
          severity: "HIGH,CRITICAL"
          exit-code: "1" # This stops the pipeline if vulnerabilities are found

      - name: Set up kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }} # You would add this to GitHub Secrets

      - name: Deploy to Green Environment
        run: |
          cd k8s/overlays/green
          kustomize edit set image devsecops-node-app=devsecops-node-app:${{ github.sha }}
          kubectl apply -k .

      - name: Wait for Deployment
        run: |
          kubectl rollout status deployment/green-node-app --timeout=90s

      - name: Smoke Test (Green)
        run: |
          echo "Starting port-forward to Green service..."
          kubectl port-forward svc/green-node-app-service 8080:80 &
          PORT_FORWARD_PID=$!
          echo "Waiting for port-forward to initialize..."
          sleep 10
          echo "Verifying Green Health..."
          if ! curl -f http://localhost:8080/api/status; then
            echo "Health check failed!"
            kill $PORT_FORWARD_PID
            exit 1
          fi
          echo "Health check passed!"
          kill $PORT_FORWARD_PID

      - name: DAST (OWASP ZAP Scan)
        run: |
          echo "Starting port-forward for DAST..."
          kubectl port-forward svc/green-node-app-service 8080:80 &
          PORT_FORWARD_PID=$!
          sleep 10
          echo "Running ZAP Baseline Scan..."
          docker run --rm --network host ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://localhost:8080 || true
          kill $PORT_FORWARD_PID

      - name: Rollback Traffic on Failure
        if: failure()
        run: |
          echo "Deployment or Smoke Test failed! Rolling back traffic to Blue..."
          kubectl patch svc final-production-service -p '{"spec":{"selector":{"variant":"blue"}}}'

      - name: Traffic Flip (Blue -> Green)
        run: |
          # Patch Service to Green
          kubectl patch svc final-production-service -p '{"spec":{"selector":{"variant":"green"}}}'
